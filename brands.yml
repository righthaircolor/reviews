# Список брендов для сбора отзывов.
# Измените этот файл и сохраните (Commit changes) — сбор запустится автоматически.
#
# ── ЧТО ПОДКЛЮЧАЕТСЯ САМО ПО РЫНКАМ (поле markets) ────────────────────────────
#   любая страна → App Store этой страны и Google Play (на языке страны)
#   ru           → + RuStore (если указан google_play_id)
#   by           → + Onliner (ищет товары бренда в каталоге и собирает отзывы на них)
#   Если бренда в таком источнике нет, в журнале будет «нет данных» — это не ошибка.
#
# ── ЧТО ДОБАВЛЯЕТСЯ ВРУЧНУЮ (нужны ссылки на конкретные точки или страницы) ───
#   2gis:        [ссылки или id филиалов]        — из адреса 2gis.ru/.../firm/70000001234567
#   yandex_maps: [ссылки или id организаций]     — из адреса yandex.ru/maps/org/название/1234567890
#                для точки в другой стране: - {id: 1234567890, market: by}
#   urls:        [любые страницы с отзывами]     — можно так: - {url: "https://...", market: by}
#
# ── ПОЛЯ БРЕНДА ────────────────────────────────────────────────────────────────
#   name            — название бренда в интерфейсе
#   markets         — коды стран: by, ru, kz, us, gb, de, pl ...
#   search          — что искать, если отличается от name (для сторов и Onliner)
#   app_store_id    — число из ссылки apps.apple.com/.../id123456789      (необязательно)
#   google_play_id  — id из ссылки play.google.com/...?id=com.example     (необязательно)
#                     без id приложение ищется по названию; что нашлось, видно в колонке
#                     «Продукт» — проверьте, что это оно
#   google_play_langs — дополнительные языки Google Play, например [be, en]
#   rustore         — пакет приложения в RuStore, если он отличается от google_play_id
#   onliner         — свой поисковый запрос для Onliner, например "dyson v15"
#   Выключить источник: app_store: false, google_play: false, rustore: false, onliner: false
#   stores: false   — у бренда нет приложений (сторы и RuStore не опрашиваются)
#
# App Store делит отзывы по странам. Google Play — по ЯЗЫКУ: для by и ru это один
# русскоязычный поток, в интерфейсе он помечен «язык RU».

limits:              # максимум отзывов за один сбор на источник
  app_store: 500     # больше Apple не отдаёт (на одну страну)
  google_play: 1000  # на один язык
  rustore: 1000
  onliner: 1000
  2gis: 500          # на один филиал

brands:
  # Примеры — замените на свои бренды.
  - name: Яндекс Go            # приложение: сторы BY и RU, RuStore подключится сам
    markets: [by, ru]
    app_store_id: 472650686
    google_play_id: ru.yandex.taxi
    onliner: false             # товаров в каталоге нет

  - name: Dyson                # товарный бренд в Беларуси: Onliner подключится сам
    markets: [by]
    stores: false

  - name: Duolingo             # глобальный рынок
    markets: [us]
    app_store_id: 570060128
    google_play_id: com.duolingo

  # Пример с точками на картах:
  # - name: Моя кофейня
  #   markets: [ru]
  #   stores: false
  #   2gis: ["https://2gis.ru/moscow/firm/70000001234567"]
  #   yandex_maps: ["https://yandex.ru/maps/org/kofeynya/1234567890/"]
