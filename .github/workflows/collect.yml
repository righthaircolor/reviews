name: Сбор отзывов

on:
  workflow_dispatch:            # кнопка «Run workflow» во вкладке Actions
  push:
    branches: [main]
    paths: [brands.yml]         # автозапуск после правки списка брендов
  schedule:
    - cron: "17 3 * * 1"        # каждый понедельник, 03:17 UTC

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать отзывы
        run: python -m collector
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Сохранить данные в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && echo "Нет изменений" && exit 0
          git commit -m "Обновление базы отзывов"
          git pull --rebase
          git push
